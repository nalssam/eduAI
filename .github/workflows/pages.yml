# site/ 폴더를 GitHub Pages 로 올린다. main 에 site/ 가 바뀔 때와 수동 실행 때 돈다.
# 아티팩트 올리기(build)와 배포(deploy)를 다른 작업으로 나눈다. 한 작업 안에서 올리자마자 배포하면
# deploy-pages 가 방금 올린 github-pages 아티팩트를 찾지 못하는 일이 있다(actions/deploy-pages#451).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
